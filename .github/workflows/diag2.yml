name: 诊断测试2

on:
  push:
    tags:
      - "diag2-*"

permissions:
  contents: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断
        run: |
          set +e
          {
            echo "=== pwd ==="
            pwd
            echo "=== git rev-parse ==="
            git rev-parse --is-inside-work-tree 2>&1
            git status 2>&1 | head -10
            echo "=== git config ==="
            git config user.name "diag" 2>&1
            git config user.email "diag@example.com" 2>&1
            echo "=== git commit ==="
            git commit --allow-empty -m "diag test commit" 2>&1
            echo "COMMIT_EXIT=$?"
            echo "=== git push ==="
            git push -f origin HEAD:diag-test 2>&1
            echo "PUSH_EXIT=$?"
            echo "=== END ==="
          } > diag_out.txt 2>&1
          BODY=$(cat diag_out.txt | jq -Rs .)
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"diag2-${{ github.run_id }}\",\"name\":\"诊断输出\",\"body\":$BODY}" | head -c 200
          echo ""
          echo "CURL_EXIT=$?"
          exit 0

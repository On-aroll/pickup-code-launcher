name: 诊断测试

on:
  push:
    tags:
      - "diag-*"

permissions:
  contents: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断
        run: |
          echo "HELLO_DIAG"
          git config user.name "diag"
          git config user.email "diag@example.com"
          git commit --allow-empty -m "diag test commit"
          git push -f origin HEAD:diag-test || true
          GH_TOKEN="${{ github.token }}" gh release create "diag-test-${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --title "诊断测试" --notes "测试" || true
          echo "DIAG_DONE"

name: 诊断测试3

on:
  push:
    tags:
      - "diag3-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: 构建诊断
        run: |
          set +e
          {
            echo "=== pwd ==="
            pwd
            echo "=== files ==="
            ls -la | head -25
            echo "=== .git check ==="
            ls -la .git 2>&1 | head -5
            echo "=== gradlew ==="
            ls -la gradlew 2>&1
            echo "=== build ==="
            ./gradlew assembleDebug --stacktrace > gradle_out.log 2>&1
            echo "GRADLE_EXIT=$?"
            tail -n 60 gradle_out.log
            echo "=== apk dir ==="
            ls -la app/build/outputs/apk/debug/ 2>&1
            echo "=== cp ==="
            cp app/build/outputs/apk/debug/app-debug.apk "快递取件-diag3.apk" 2>&1
            echo "CP_EXIT=$?"
            echo "=== ls glob ==="
            ls -la 快递取件-*.apk 2>&1
            echo "LS_EXIT=$?"
            echo "=== END ==="
          } > diag_out.txt 2>&1
          BODY=$(cat diag_out.txt | jq -Rs .)
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"diag3-${{ github.run_id }}\",\"name\":\"构建诊断\",\"body\":$BODY}" | head -c 200
          echo ""
          exit 0
